name: Build types package
description: >-
  Set up the toolchains, generate the TypeScript types from the Pydantic models,
  and compile them to dist/. Leaves a publishable checkout behind.

runs:
  using: composite
  steps:
  - name: Set up uv
    uses: astral-sh/setup-uv@v10.3.3
    with:
      python-version: '3.11'

  - name: Set up Node.js
    uses: actions/setup-node@v7.1.0
    with:
      node-version: '24'
      registry-url: 'https://registry.npmjs.org'
      scope: '@neuracore'

  - name: Install Node dependencies
    shell: bash
    run: npm install

  - name: Generate TypeScript types
    shell: bash
    run: uv run --extra dev python scripts/generate_types.py

  - name: Build TypeScript
    shell: bash
    run: npm run build
