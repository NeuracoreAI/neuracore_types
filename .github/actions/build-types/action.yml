name: Build types package
description: >-
  Set up the toolchains, generate the TypeScript types from the Pydantic models,
  and compile them to dist/. Leaves a publishable checkout behind.

runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '24'
      registry-url: 'https://registry.npmjs.org'
      scope: '@neuracore'

  - name: Install Python dependencies
    shell: bash
    run: pip install -e ".[dev]"

  - name: Install Node dependencies
    shell: bash
    run: npm install

  - name: Generate TypeScript types
    shell: bash
    run: python scripts/generate_types.py

  - name: Build TypeScript
    shell: bash
    run: npm run build
