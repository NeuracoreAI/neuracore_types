name: Pre-Commit Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.10'
    - name: Pre-Commit
      run: uvx pre-commit run --color=always --show-diff-on-failure --all-files

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Run tests with pytest
      run: uv run --extra dev --extra ml pytest tests/unit

    - name: Install Node dependencies
      run: npm install

    - name: Validate that we can generate TypeScript types
      run: uv run --extra dev --extra ml python scripts/generate_types.py

    - name: Build TypeScript
      run: npm run build

